openapi: 3.1.0
info:
  title: Operation Security
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /invoices:
    post:
      operationId: createInvoice
      security:
        - missingScheme: []
      parameters:
        - name: X-Correlation-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpsertRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        "400":
          description: Bad request
        "500":
          description: Server error
components:
  schemas:
    InvoiceUpsertRequest:
      type: object
      properties:
        external_id:
          type: string
      required:
        - external_id
    InvoiceResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id