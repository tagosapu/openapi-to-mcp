# LLM Model Configuration
#model: bedrock/us.anthropic.claude-3-5-sonnet-20241022-v2:0
#model: azure/your-deployment-name
model: anthropic/claude-sonnet-4-20250514
# Model Parameters
# Set max_tokens to 8192 for Amazon Bedrock bedrock/us.anthropic.claude-3-5-sonnet-20241022-v2:0
max_tokens: 16384
temperature: 0.1
timeout_seconds: 900
azure_max_retries: 0
azure_max_single_prompt_tokens: 60000
azure_chunk_prompt_tokens: 64000
azure_chunk_prompt_overhead_tokens: 4000
azure_chunk_max_tokens: 16384
azure_chunk_retry_limit: 2
azure_max_concurrency: 3
azure_chunk_cache_enabled: true
azure_chunk_cache_dir: ./results/.cache
diagnostic_log_file: ./logs/aoai_run.log
runtime_artifact_dir: ./results/runtime
debug: false

# Evaluation Thresholds
good_evaluation_threshold: 3.0  # Minimum score for "good" evaluation
generate_mcp_threshold: 3.0     # Minimum score to generate MCP server

# Directory Configuration
templates_dir: ./templates